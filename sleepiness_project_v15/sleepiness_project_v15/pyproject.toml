[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    ".",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepiness-detection"
version = "18.0.0"
description = "Real-time sleepiness detection system with MediaPipe and CNN"
readme = "GETTING_STARTED.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sleepiness Detection Team"}
]
keywords = ["computer-vision", "sleepiness-detection", "mediapipe", "pytorch", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "pygame>=2.5.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]
classroom = [
    "ultralytics>=8.0.0",
    "lap>=0.4.0",
    "filterpy>=1.4.5",
]
web = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "websockets>=11.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/sleepiness-detection"
Documentation = "https://github.com/yourusername/sleepiness-detection/wiki"
Repository = "https://github.com/yourusername/sleepiness-detection"
Changelog = "https://github.com/yourusername/sleepiness-detection/blob/main/CHANGELOG.md"

[project.scripts]
sleepiness-webcam = "webcam_sleepiness:main"
sleepiness-train = "train_sleepiness:main"
sleepiness-classroom = "classroom_monitor:main"
