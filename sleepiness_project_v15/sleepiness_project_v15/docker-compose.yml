# Docker Compose for Sleepiness Detection System
# Production-ready multi-service deployment

version: '3.8'

services:
  # ─── API Service ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sleepiness-detection:v21.0.0
    container_name: sleepiness-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SLEEPINESS_LOG_LEVEL=INFO
      - SLEEPINESS_ENABLE_METRICS=true
      - SLEEPINESS_LOG_TO_FILE=true
      - SLEEPINESS_LOG_FILE=/logs/api.log
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - logs:/logs
      - snapshots:/data/snapshots
      - metrics:/data/metrics
    networks:
      - sleepiness-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ─── Webcam Service ────────────────────────────────────────────────────────
  webcam:
    build:
      context: .
      dockerfile: Dockerfile
    image: sleepiness-detection:v21.0.0
    container_name: sleepiness-webcam
    restart: unless-stopped
    command: ["python", "webcam_sleepiness.py", "--onnx", "--no-display", "--metrics-json", "/data/metrics/session.json"]
    environment:
      - SLEEPINESS_LOG_LEVEL=INFO
      - SLEEPINESS_PRESET=balanced
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - logs:/logs
      - snapshots:/data/snapshots
      - metrics:/data/metrics
    devices:
      - /dev/video0:/dev/video0  # Webcam access
    networks:
      - sleepiness-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  # ─── Prometheus (Metrics) ──────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sleepiness-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sleepiness-net

  # ─── Grafana (Visualization) ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sleepiness-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - sleepiness-net
    depends_on:
      - prometheus

  # ─── Redis (Caching) ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sleepiness-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - sleepiness-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Nginx (Reverse Proxy) ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sleepiness-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - logs:/var/log/nginx
    networks:
      - sleepiness-net
    depends_on:
      - api

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  sleepiness-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  logs:
    driver: local
  snapshots:
    driver: local
  metrics:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  redis-data:
    driver: local
